name: Product API CRUD CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-crud:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Create CI environment file
        run: |
          cat > .env <<'EOF'
          PORT=3000
          MONGODB_URI=mongodb://mongodb:27017/productdb
          EOF

      - name: Build and wait for healthy services
        run: docker compose up -d --build --wait --wait-timeout 120

      - name: Check container status
        run: docker compose ps

      - name: Test Product CRUD
        run: node scripts/test-crud.js

      - name: Push tested image to Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          printf '%s' "$DOCKERHUB_TOKEN" | docker login \
            --username "$DOCKERHUB_USERNAME" --password-stdin

          IMAGE="$DOCKERHUB_USERNAME/product-api"

          docker tag product-api:local "$IMAGE:$GITHUB_SHA"
          docker tag product-api:local "$IMAGE:latest"

          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"

      - name: Show container logs
        if: always()
        run: docker compose logs --no-color

      - name: Stop containers
        if: always()
        run: docker compose down -v

  deploy-local:
    needs: test-crud
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: [self-hosted, Windows, X64, product-api-local]
    timeout-minutes: 10

    concurrency:
      group: product-api-local-deploy
      cancel-in-progress: false

    defaults:
      run:
        shell: powershell

    env:
      DOCKER_CONTEXT: desktop-linux
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Create local deployment environment
        run: |
          Set-Content -Path .env -Encoding ascii -Value @(
            "PORT=3000"
            "MONGODB_URI=mongodb://mongodb:27017/productdb"
          )

      - name: Pull tested image from Docker Hub
        run: docker compose -p product-api -f docker-compose-prod.yaml pull product-api

      - name: Deploy and wait for healthy services
        run: docker compose -p product-api -f docker-compose-prod.yaml up -d --wait --wait-timeout 120

      - name: Check deployed containers
        run: docker compose -p product-api -f docker-compose-prod.yaml ps

      - name: Test deployed Product API
        run: node scripts/test-crud.js

      - name: Show deployment logs
        if: always()
        run: docker compose -p product-api -f docker-compose-prod.yaml logs --no-color